# Deploys website/public, the landing page at usemayoi.com, to Cloudflare
# Pages as pushes to main change it. Needs the CLOUDFLARE_API_TOKEN secret
# (a token with Cloudflare Pages: Edit) and the CLOUDFLARE_ACCOUNT_ID
# variable.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy website/public
          --project-name mayoi --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
